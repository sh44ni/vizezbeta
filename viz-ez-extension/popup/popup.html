<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640">
  <title>VizEz Brain</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-top">
        <div class="logo-row">
          <div class="logo-icon-wrap">
            <svg viewBox="0 0 100 100" width="28" height="28">
              <rect width="100" height="100" rx="50" fill="#111"/>
              <path d="M36.52,53.3C43.93,42.49,51.27,31.81,58.69,21H56.35c-9.13.08-18.26.06-27.4,0-.57,0-1.14,0-1.71,0a4.33,4.33,0,0,0-2.4.84,4.91,4.91,0,0,0-2,3.69c0,.43,0,.86,0,1.28q0,14.93,0,29.83c0,3.72,0,7.44,0,11.16A4.94,4.94,0,0,0,26,72.44a6.77,6.77,0,0,0,2.6.36l17.38,0h.79c.67,0,.59.07.83-.63s.38-1.23.59-1.83c1-2.87,2-5.72,2.93-8.59.75-2.2,1.49-4.42,2.23-6.63a9.39,9.39,0,0,0,.53-1.8Z" fill="#e2e0f0"/>
              <path d="M46.89,81.62l.16.11Q62.13,62,77.23,42.19a.89.89,0,0,0-.66-.1c-2.22.06-4.43-.1-6.65,0-2.52.08-5,0-7.58,0-.63,0-.64,0-.65-.63,0-.12,0-.24,0-.36q0-9.69,0-19.38c0-.15.09-.33-.07-.45-.61.59-20.29,29.22-20.45,29.75.17.11.36.05.55.05L46,51c3.38,0,6.77,0,10.15,0,.88,0,1.19-.26.75,1q-2.79,8.18-5.55,16.37c-1.18,3.48-2.34,7-3.52,10.43C47.52,79.79,47.2,80.7,46.89,81.62Z" fill="#e2e0f0"/>
              <path d="M36.52,53.3H53.86a9.39,9.39,0,0,1-.53,1.8c-.74,2.21-1.48,4.43-2.23,6.63-1,2.87-2,5.72-2.93,8.59-.21.6-.38,1.22-.59,1.83s-.16.62-.83.63H46l-17.38,0a6.77,6.77,0,0,1-2.6-.36,4.94,4.94,0,0,1-3.2-4.58c0-3.72,0-7.44,0-11.16q0-14.91,0-29.83c0-.42,0-.85,0-1.28a4.91,4.91,0,0,1,2-3.69,4.33,4.33,0,0,1,2.4-.84c.57,0,1.14,0,1.71,0,9.14,0,18.27,0,27.4,0h2.34C51.27,31.81,43.93,42.49,36.52,53.3Z" fill="#7c5cfc"/>
              <path d="M46.89,81.62c.31-.92.63-1.83.94-2.75,1.18-3.48,2.34-7,3.52-10.43q2.76-8.19,5.55-16.37c.44-1.31.13-1-.75-1-3.38,0-6.77,0-10.15,0l-4.29,0c-.19,0-.38.06-.55-.05.16-.53,19.84-29.16,20.45-29.75.16.12.07.3.07.45q0,9.69,0,19.38c0,.12,0,.24,0,.36,0,.62,0,.62.65.63,2.53,0,5.06.12,7.58,0,2.22-.06,4.43.1,6.65,0a.89.89,0,0,1,.66.1Q62.12,62,47.05,81.73Z" fill="#d7ac4e"/>
            </svg>
          </div>
          <div>
            <h1 class="logo-title">VizEz Brain</h1>
            <span class="version-badge">v3.0</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-refresh" class="icon-btn" title="Refresh portals">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>
      </div>
      <!-- Status bar -->
      <div id="status-bar" class="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <!-- View: Portal List -->
    <section id="view-portals" class="view active">
      <div id="portals-loading" class="empty-state">
        <div class="spinner"></div>
        <p>Loading portals...</p>
      </div>
      <div id="portals-empty" class="empty-state" style="display:none">
        <div class="empty-icon">🌐</div>
        <h3>No portals yet</h3>
        <p>Send data from VizEz web app to get started.</p>
      </div>
      <div id="portals-list" style="display:none"></div>
    </section>

    <!-- View: Portal Detail -->
    <section id="view-detail" class="view">
      <button id="btn-back" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        All Portals
      </button>

      <div id="detail-header" class="detail-header">
        <span id="detail-icon" class="detail-icon">🌐</span>
        <div class="detail-info">
          <div id="detail-name" class="detail-name">—</div>
          <div id="detail-status" class="detail-status"></div>
        </div>
      </div>

      <!-- Current applicant -->
      <div id="detail-empty" class="empty-state" style="display:none">
        <div class="empty-icon">📭</div>
        <h3>No data queued</h3>
        <p>Extract documents in VizEz and click <strong>Send to Portal</strong>.</p>
      </div>

      <div id="detail-fill" style="display:none">
        <!-- Progress -->
        <div class="fill-progress">
          <span id="detail-progress-text">1 of 1</span>
          <div class="fill-progress-bar"><div id="detail-progress-fill"></div></div>
        </div>

        <!-- Current applicant card -->
        <div class="current-card">
          <div class="current-avatar" id="detail-avatar">👤</div>
          <div class="current-info">
            <div class="current-name" id="detail-applicant-name">—</div>
            <div class="current-meta" id="detail-applicant-meta">—</div>
          </div>
          <div id="detail-badge" class="fill-badge" style="display:none">✓ Filled</div>
        </div>

        <!-- Fill button -->
        <button id="btn-detail-fill" class="btn-primary btn-full fill-btn-main">▶ Fill</button>
        <button id="btn-detail-refill" class="btn-primary btn-full fill-btn-main" style="display:none;background:var(--accent-soft);color:var(--accent);border:1px solid rgba(124,92,252,0.25)">↺ Re-fill</button>

        <!-- Navigation -->
        <div class="fill-nav-row">
          <button id="btn-detail-prev" class="btn-sm btn-ghost">‹ Prev</button>
          <button id="btn-detail-skip" class="btn-sm btn-warn">Skip ›</button>
          <button id="btn-detail-next" class="btn-sm btn-ghost">Next ›</button>
        </div>

        <!-- Queue list -->
        <div class="queue-divider">
          <span>Queue</span>
          <button id="btn-clear-queue" class="btn-sm btn-ghost" style="font-size:10px;padding:2px 8px">Clear</button>
        </div>
        <div id="detail-queue" class="queue-list"></div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
