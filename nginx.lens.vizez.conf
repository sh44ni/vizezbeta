# VizEz Lens — lens.vizez.cloud
# Copy to /etc/nginx/sites-available/lens.vizez.cloud
# ln -s /etc/nginx/sites-available/lens.vizez.cloud /etc/nginx/sites-enabled/
# certbot --nginx -d lens.vizez.cloud

server {
    listen 80;
    server_name lens.vizez.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lens.vizez.cloud;

    # SSL managed by certbot (uncomment after certbot runs)
    # ssl_certificate /etc/letsencrypt/live/lens.vizez.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lens.vizez.cloud/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=lens_api:10m rate=30r/m;

    # Next.js frontend — handles everything including its own /api/ routes
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Processor enhance endpoint — rate limited, larger body
    location /api/processor/enhance {
        limit_req zone=lens_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # Internal webhook from backend — only allow localhost
    location /api/processor/log {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
